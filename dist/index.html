<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="/vrchat/assets/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdc41f">
  <script src="/vrchat/desktop-layout.js" defer></script>
  <title>VRChat | Undery</title>
  <link rel="stylesheet" href="/vrchat/fonts.css">
  <link rel="stylesheet" href="/vrchat/styles.css">
  <script src="/vrchat/gallery.js" defer></script>
</head>
<body>
  <main class="landing">
    <header class="hero" aria-labelledby="poster-title">
      <h1 id="poster-title" class="sr-only">VRChat · Undery</h1>
      <img class="poster-art" src="/vrchat/assets/undery-poster.webp" width="2048" height="1152"
           alt="꽃관을 쓰고 해바라기 꽃다발을 든 언더리" fetchpriority="high">
      <img class="monogram" src="/vrchat/assets/undery-mark.png" width="490" height="384" alt="">
      <div class="sr-only">
        <p>언더리 <span lang="en">/ˈʌndəri/</span></p>
        <p>절대 내 이름을 엉덩이로 부르지마</p>
        <p>“Under”과 “Restart”를 합성한 닉네임으로 막히거나 풀리지 않을 때 그 자리에서 머무는 것 보다 다시 처음부터 차근히 짚고 올라가자는 의미를 담은 닉네임 입니다.</p>
      </div>
    </header>

    <nav class="socials" aria-label="언더리 커뮤니티">
      <a href="https://vrc.group/ASS.8448" aria-label="VRChat 그룹">
        <img class="group-mark" src="/vrchat/assets/group-mark.webp" alt="">
      </a>
      <a href="https://discord.gg/gub" aria-label="Discord">
        <span class="social-mark discord" aria-hidden="true"></span>
      </a>
      <a href="https://x.com/VRC_UDR" aria-label="X">
        <span class="social-mark x-mark" aria-hidden="true"></span>
      </a>
    </nav>

    <div class="collection">
      <a class="event-banner" href="/vrchat/birthday">
        <img src="/api/vrchat/birthday/banner" alt="">
        <span class="event-label" lang="en">EVENT</span>
        <span class="event-copy"><strong lang="en">THANK YOU<br>EVERYONE!</strong><span>감사 인사를 확인하세요!</span></span>
      </a>
      <section class="media-section" aria-labelledby="photo-title">
        <div class="section-heading">
          <h2 id="photo-title" lang="en">PHOTO</h2>
          <a href="/vrchat/photos.html" aria-label="사진 더 보기">더 보기</a>
        </div>
        <ul class="preview-grid photo-grid" data-gallery-preview="photo" aria-label="사진 미리보기"></ul>
      </section>
      <section class="media-section" aria-labelledby="video-title">
        <div class="section-heading">
          <h2 id="video-title" lang="en">VIDEO</h2>
          <a href="/vrchat/videos.html" aria-label="영상 더 보기">더 보기</a>
        </div>
        <ul class="preview-grid video-grid" data-gallery-preview="video" aria-label="영상 미리보기"></ul>
      </section>
    </div>
  </main>
  <img class="vrchat-peek" src="/vrchat/assets/peek.png" width="448" height="426" alt="" loading="lazy">
</body>
</html>
