<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="/vrchat/assets/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdc41f">
  <script src="/vrchat/desktop-layout.js" defer></script>
  <title>PHOTO · Undery VRChat</title>
  <link rel="stylesheet" href="/vrchat/fonts.css">
  <link rel="stylesheet" href="/vrchat/gallery.css">
  <link rel="stylesheet" href="/vrchat/viewer.css">
  <script src="/vrchat/gallery.js" defer></script>
</head>
<body data-gallery="photo">
  <header class="gallery-heading">
    <div class="gallery-width">
      <a class="gallery-back" href="/vrchat" aria-label="VRChat 메인으로 돌아가기">
        <svg aria-hidden="true" width="36" height="11" viewBox="0 0 36 11" fill="none"><path d="M8.5 1.5 1.5 8.5H34.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 lang="en">PHOTO</h1>
    </div>
  </header>
  <main class="gallery-width gallery-main" aria-label="사진 갤러리">
    <form class="gallery-filters" aria-label="사진 필터" hidden></form>
    <section class="gallery-results" aria-label="사진 목록" aria-busy="true">
      <p class="gallery-status" role="status" aria-live="polite"></p>
      <div class="gallery-grids"></div>
      <button type="button" class="gallery-more" disabled>더 보기</button>
    </section>
    <noscript><p><a href="/vrchat/assets/sunset.webp">노을을 바라보는 언더리</a> · <a href="/vrchat/assets/avatar.png">언더리의 초상 사진</a></p></noscript>
  </main>
</body>
</html>
