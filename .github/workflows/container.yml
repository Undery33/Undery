name: Container checks

on:
  push:
    branches: [feature/site-foundation]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Jenkinsfile
      - deploy/**
      - scripts/**
      - tests/**
      - .github/workflows/container.yml

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Undery33/Undery
          ref: feature/vrchat-web-gui
          path: web-source
          persist-credentials: false
      - name: Check Jenkins feature selection with live GitHub activity
        if: github.event_name == 'push'
        working-directory: infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET repos/Undery33/Undery/activity -f direction=desc -F per_page=100 > "$RUNNER_TEMP/activity.json"
          python3 - "$RUNNER_TEMP/activity.json" <<'PY'
          import json, runpy, sys
          from pathlib import Path
          events = json.loads(Path(sys.argv[1]).read_text())
          select = runpy.run_path("deploy/deployment-policy.py")["latest"]
          selected = select(events)
          if not selected:
              sys.exit("No deployable feature revision found in repository activity")
          print(selected["branch"], selected["sha"])
          PY
      - name: Validate tooling and prepare isolated image context
        run: |
          cd infrastructure
          python3 -m unittest discover -s tests/container -v
          python3 -m unittest discover -s tests/deploy -v
          python3 scripts/prepare-container-context.py --source ../web-source --output ../container-context --commit "$(git -C ../web-source rev-parse HEAD)" --branch feature/vrchat-web-gui --pipeline-commit "$(git rev-parse HEAD)"
      - uses: docker/setup-buildx-action@v4
      - name: Build with BuildKit
        run: |
          docker buildx build --pull --load --platform linux/amd64 \
            --build-arg SOURCE_COMMIT="$(git -C web-source rev-parse HEAD)" \
            --build-arg SOURCE_BRANCH=feature/vrchat-web-gui \
            --build-arg PIPELINE_COMMIT="$(git -C infrastructure rev-parse HEAD)" \
            --tag undery-container-check:ci container-context
      - name: Test actual Nginx image
        run: python3 infrastructure/scripts/verify-container.py --image undery-container-check:ci --metadata container-context/health.json
