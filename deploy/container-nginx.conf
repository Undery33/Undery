# Full configuration for a read-only, non-root Nginx container.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /opt/undery/dist;
        index index.html;
        autoindex off;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-cache always;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /api/health {
            alias /opt/undery/health.json;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
        }

        # No trailing slash: the unchanged HTML's ./assets and ./styles.css
        # resolve to root paths from both / and /vrchat.
        location = /vrchat {
            try_files /index.html =404;
        }
        location = /vrchat/ {
            return 308 /vrchat$is_args$args;
        }

        location ~ (^|/)\. {
            return 404;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
