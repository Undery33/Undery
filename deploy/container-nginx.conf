# Full configuration for a read-only, non-root Nginx container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_x_forwarded_proto $public_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8080;
        server_name _;
        # Preserve the public scheme/host/port across reverse proxies.
        absolute_redirect off;
        root /opt/undery/dist;
        index index.html;
        autoindex off;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /api/health {
            # Keep the deployment metadata contract while also checking Next.
            auth_request /_main_health;
            alias /opt/undery/health.json;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
        }

        location = /_main_health {
            internal;
            proxy_pass http://127.0.0.1:3001/api/health;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # GUI files own this prefix only; the site's root remains the Next app.
        location = /vrchat {
            alias /opt/undery/dist/index.html;
            default_type text/html;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location = /vrchat/ {
            return 308 /vrchat$is_args$args;
        }
        location /vrchat/ {
            alias /opt/undery/dist/;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Registration carries public text and a one-use token in a pasted URL.
        # Suppress query-bearing access AND upstream error logs on this subtree.
        # The host proxy must overwrite X-Undery-Client-IP, and the published
        # container port must remain loopback-only before TRUST_PROXY is enabled.
        location ~ ^/birthday/memo(?:/|$) {
            access_log off;
            error_log /dev/null crit;
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Undery-Client-IP $http_x_undery_client_ip;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }

        location ~ (^|/)\. {
            return 404;
        }
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
