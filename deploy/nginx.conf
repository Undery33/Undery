# Example HTTP virtual host. Replace the domain and root for your server.
# Load inside nginx's http {} context, with the normal mime.types include.
server {
    listen 80;
    server_name undery.example.com;

    root /var/www/undery/current;
    index index.html;
    charset utf-8;
    autoindex off;

    # Keep hidden files and hidden directories private.
    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.html?$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Assets may be replaced under the same name, so do not use immutable.
    location ~* \.(?:css|js|mjs|png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1d;
    }

    # No SPA fallback: missing files must remain genuine 404 responses.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
