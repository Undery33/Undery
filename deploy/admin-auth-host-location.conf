# Replace the existing /api/auth/ location ONLY in the canonical HTTPS vhost.
# Do not add a duplicate location. Preserve the vhost's TLS and all other routes.
# Back up that vhost and run nginx -t before reload. The container limits POST
# to /api/auth/github, /api/auth/logout and /birthday/memo/admin/entries.
location ^~ /api/auth/ {
    # OAuth codes/state and cookies must never enter URL-bearing access/error logs.
    access_log off;
    error_log /dev/null crit;
    limit_req zone=undery_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host undery.link;
    proxy_set_header X-Forwarded-Host undery.link;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Undery-Client-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
}
