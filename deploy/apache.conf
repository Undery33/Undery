# Example Apache 2.4 HTTP virtual host. Replace the domain and root.
# Requires the standard mod_dir, mod_authz_core and mod_headers modules.
# The server's main configuration must already contain Listen 80.
<VirtualHost *:80>
    ServerName undery.example.com
    DocumentRoot "/var/www/undery/current"

    <Directory "/var/www/undery/current">
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource disabled
    </Directory>

    <FilesMatch "(?i)\.html?$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    <FilesMatch "(?i)\.(css|js|mjs|png|jpe?g|webp|avif|gif|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>

    # Block hidden path segments, including hidden directories.
    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>
</VirtualHost>
