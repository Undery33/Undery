# Include ONLY inside the existing canonical HTTPS server for undery.link.
# Keep its existing root/VRChat/auth/admin locations and TLS configuration.
# After backing up the live vhost, add this include and run nginx -t before reload.
# Do not enable BIRTHDAY_MEMO_TRUST_PROXY until this edge header overwrite is active.
location = /birthday/memo {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host undery.link;
    proxy_set_header X-Forwarded-Host undery.link;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Undery-Client-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /birthday/memo/ {
    # Submission URL contains the visitor's nickname, message and one-time token.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host undery.link;
    proxy_set_header X-Forwarded-Host undery.link;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Undery-Client-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Referrer-Policy "no-referrer" always;
}
